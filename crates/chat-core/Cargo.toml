[package]
name = "chat-core"
description = "Import, merge, storage and search for Instagram chat exports"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
imagesize = "0.15.0"
infer = "0.22.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-segmentation = "1.13.3"
walkdir = "2.5.0"
zip = { version = "9.2.0", default-features = false, features = ["deflate", "deflate64"] }

[dev-dependencies]
blake3 = "1.8.7"
