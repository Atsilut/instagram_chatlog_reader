# Builds unsigned Linux packages. This workflow does not create a tag or a
# GitHub Release. Publish release attaches these packages after the Windows
# and macOS builds have finished.
name: Linux build

on:
  push:
    branches:
      - release/linux
  workflow_dispatch:

jobs:
  build:
    name: Ubuntu 22.04 x86_64
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build deb and AppImage
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: npm run tauri build -- --ci --bundles deb,appimage

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: instagram-chat-viewer-linux-amd64
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
